            - complementary "ホスティングは「永続ディスクを持てるもの」限定" [ref=f3e251]:
              - paragraph [ref=f3e252]: ホスティングは「永続ディスクを持てるもの」限定
              - paragraph [ref=f3e256]:
                - text: Cloudflare Pages / Vercel / Netlify は
                - strong [ref=f3e257]: ファイルシステムが使い捨て
                - text: なので、SQLiteファイルがデプロイのたびに消える。この構成では選べない。 選択肢は
                - strong [ref=f3e258]: Fly.io（Volume）/ Render（Persistent Disk）/ VPS
                - text: のいずれか。ここでは Fly.io を前提に書くが、
                - code [ref=f3e259]: DB_PATH
                - text: を差し替えるだけで他へ移せる。
            - complementary "インスタンスは1台に固定する" [ref=f3e260]:
              - paragraph [ref=f3e261]: インスタンスは1台に固定する
              - paragraph [ref=f3e265]:
                - text: ボリュームは1つのマシンにしか付かない。オートスケールで2台目が立つと
                - strong [ref=f3e266]: DBを持たないインスタンスが生まれる
                - text: ので、
                - code [ref=f3e267]: fly.toml
                - text: で
                - code [ref=f3e268]: min_machines_running = 1
                - text: / 最大1台に固定しておく。10人規模なら性能は全く問題ない。
            - button "💬 このセクションにコメント" [ref=f3e270] [cursor=pointer]
            - generic [ref=f3e271]:
              - heading "SQLite の必須設定" [level=2] [ref=f3e272]
              - link "Section titled “SQLite の必須設定”" [ref=f3e273] [cursor=pointer]:
                - /url: "#sqlite-の必須設定"
            - paragraph [ref=f3e278]:
              - text: サーバー起動時に必ず入れる
              - code [ref=f3e279]: PRAGMA
              - text: 。Postgres から移った分、ここは自分で面倒を見る。
            - figure "server/db.ts" [ref=f3e281]:
              - code [ref=f3e285]:
                - generic [ref=f3e286]: "import { Database } from 'bun:sqlite';"
                - generic [ref=f3e290]: "export const db = new Database(process.env.DB_PATH ?? './majan.db', { create: true });"
                - generic [ref=f3e294]: db.exec('PRAGMA journal_mode = WAL'); // 読み書きの同時実行。閲覧中の書き込みがブロックされない
                - generic [ref=f3e296]: db.exec('PRAGMA foreign_keys = ON'); // SQLiteは既定でOFF。毎接続で有効化が必要
                - generic [ref=f3e298]: db.exec('PRAGMA busy_timeout = 5000'); // 書き込みロック待ちで即エラーにしない
                - generic [ref=f3e300]: db.exec('PRAGMA synchronous = NORMAL'); // WAL時の推奨値
              - button "Copy to clipboard" [ref=f3e303] [cursor=pointer]
            - complementary "foreign_keys は毎回入れる" [ref=f3e305]:
              - paragraph [ref=f3e306]: foreign_keys は毎回入れる
              - paragraph [ref=f3e310]:
                - text: SQLite の外部キー制約は
                - strong [ref=f3e311]: 接続ごとに既定でOFF
                - text: 。スキーマに
                - code [ref=f3e312]: REFERENCES
                - text: を書いても、
                - code [ref=f3e313]: PRAGMA foreign_keys = ON
                - text: を忘れると何も効かない。Postgres との一番大きな挙動差なので注意。
