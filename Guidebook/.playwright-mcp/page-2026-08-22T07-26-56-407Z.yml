            - complementary "Supabase をやめたことのトレードオフ" [ref=e225]:
              - paragraph [ref=e226]: Supabase をやめたことのトレードオフ
              - paragraph [ref=e230]:
                - text: SQLite に寄せたことで
                - strong [ref=e231]: 無料のマネージド運用（自動バックアップ・Dashboard・RLS）が無くなり、自前で面倒を見る範囲が増えた
                - text: 。具体的には (a) サーバー1台の維持、(b) バックアップの仕組み（#17）、(c) デプロイ時にボリュームを壊さない運用、の3つが新たに自分の責任になる。 その代わり
                - strong [ref=e232]: DBがファイル1個
                - text: になるので、コピー1回でバックアップも本番データのローカル再現も完了する。10人・書き込み1人という規模ならこちらの方が総コストは低いと判断した。
            - complementary "パスコードで守れる範囲" [ref=e233]:
