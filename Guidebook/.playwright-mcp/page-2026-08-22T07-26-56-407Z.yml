              - paragraph [ref=e238]:
                - text: 書き込みパスコードは
                - strong [ref=e239]: 共通の合言葉1本
                - text: 。漏れたら誰でも書き込めるし、誰が書いたかも追跡できない。これは「荒らし対策」ではなく
                - strong [ref=e240]: 「URLを踏んだ第三者が事故で書き換えるのを防ぐ」レベルの防御
                - text: だと理解しておく。閲覧側は無防備のまま（URLが漏れたら中身は見られる）。ここが気になるようになったら、Basic認証をサーバー全体に掛けるのが一番安い。
